<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>이동 중</title>
<meta name="robots" content="noindex"><script>
var p=location.pathname.split('/');var base=/github\.io$/.test(location.hostname)?'/'+p[1]+'/':'/';
if(location.pathname!==base)location.replace(base+location.search+location.hash);
</script></head><body>페이지를 찾을 수 없어 첫 화면으로 이동합니다.</body></html>
